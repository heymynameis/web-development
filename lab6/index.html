<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Простой чат на WebSocket</title>
    <link rel="stylesheet" href="main.css">
    <!-- Ссылка на манифест PWA будет добавлена позже -->
</head>
<body>
    <div id="app">
        <h1>WebSocket Чат</h1>
        <div id="status" class="disconnected">Статус: Отключено</div>
        <div id="messages"></div>
        <form id="message-form">
            <input type="text" id="message-input" placeholder="Сообщение" autocomplete="off" disabled>
            <button type="submit" disabled>Отправить</button>
        </form>
    </div>
    <script src="client.js"></script>
</body>
</html>
